data:
  n_samples: 2000
  n_features: 20
  n_classes: 3
  n_informative: 15
  n_redundant: 3
  random_state: 42
  output_dir: data/raw

preprocess:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  normalize: true
  input_dir: data/raw
  output_dir: data/processed

train:
  model:
    hidden_sizes: [128, 64, 32]
    dropout_rate: 0.3
    activation: relu
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0001
  training:
    epochs: 100
    batch_size: 64
    early_stopping:
      patience: 10
      min_delta: 0.001
      monitor: val_loss
    checkpoint:
      save_best_only: true
      monitor: val_loss
  scheduler:
    name: reducelronplateau
    factor: 0.5
    patience: 5
  input_dir: data/processed
  model_dir: models
  seed: 42

evaluate:
  model_path: models/best_model.pt
  data_dir: data/processed
  metrics_dir: metrics
  compute_confusion_matrix: true
  compute_roc_curves: true
  top_k: [3, 5]
