# ML Pipeline Parameters
# 所有超参数集中管理，支持 DVC 实验追踪

# 数据生成参数
data:
  n_samples: 5000
  n_features: 20
  n_classes: 3
  n_informative: 15
  n_redundant: 5
  random_state: 42
  test_size: 0.2
  val_size: 0.1

# 数据预处理参数
preprocess:
  normalize: true
  normalization_method: "standard"  # standard, minmax
  shuffle: true

# 模型参数
model:
  input_dim: 20
  hidden_dims: [128, 64, 32]
  output_dim: 3
  dropout_rate: 0.3
  activation: "relu"

# 训练参数
train:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # adam, sgd
  scheduler: "reduce_on_plateau"  # step, exponential, reduce_on_plateau
  scheduler_patience: 5
  scheduler_factor: 0.5

# 早停参数
early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001
  monitor: "val_loss"
  mode: "min"

# 模型保存参数
checkpoint:
  save_best_only: true
  monitor: "val_accuracy"
  mode: "max"

# 评估参数
eval:
  batch_size: 128
  top_k: 3
